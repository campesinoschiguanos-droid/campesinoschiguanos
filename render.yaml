services:
  - type: web
    name: campesinos-chiguanos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --listen=0.0.0.0:$PORT --url-scheme=https --threads=4 --connection-limit=100 --max-request-body-size=16384 --max-request-header-size=8192 app:app
    healthCheckPath: /healthz
    domains:
      - campesinochiguanos.com
    envVars:
      - key: CUSTOM_DOMAINS
        value: campesinochiguanos.com,www.campesinochiguanos.com
      - key: TRUSTED_HOSTS
        value: campesinos-chiguanos.onrender.com,campesinochiguanos.com,www.campesinochiguanos.com
